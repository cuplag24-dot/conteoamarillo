<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTEO AMARILLO - Tu PCGE Interactivo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- BARRA LATERAL (SIDEBAR) -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">T</span>
      <div>
        <h2>CONTEO <span>AMARILLO</span></h2>
        <p>Tu PCGE, rápido y fácil</p>
      </div>
    </div>

    <nav class="menu">
      <a href="#" class="active" onclick="mostrarInicio()"><i class="fa-solid fa-house"></i> Inicio</a>
      <a href="#" onclick="mostrarInicio()"><i class="fa-solid fa-book-open"></i> Plan Contable</a>
      <a href="#" onclick="focarBuscador()"><i class="fa-solid fa-magnifying-glass"></i> Buscar</a>
    </nav>

    <div class="promo-card">
      <div class="badge-yellow">CONTEO AMARILLO</div>
      <p>Aprende y consulta de forma fácil</p>
      <button class="btn-explore" onclick="mostrarInicio()">¡Vamos a explorar! &rarr;</button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    
    <!-- BARRA SUPERIOR (HEADER) -->
    <header class="top-bar">
      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Buscar cuenta, código o nombre..." oninput="buscarCuenta()">
      </div>
    </header>

    <!-- VISTA PRINCIPAL (ELEMENTOS DEL PCGE) -->
    <div id="vistaPrincipal">
      <!-- BANNER HERO -->
      <section class="hero">
        <div class="hero-text">
          <h1>Plan Contable General Empresarial</h1>
          <p>Explora el PCGE de manera interactiva y sencilla.</p>
        </div>
      </section>

      <!-- SECCIÓN DE ELEMENTOS DEL PCGE -->
      <section class="elements-section">
        <h2><i class="fa-solid fa-layer-group"></i> Elementos del PCGE</h2>
        <div class="grid-elements" id="gridElements">
          <!-- Las tarjetas se generan dinámicamente con JavaScript -->
        </div>
      </section>
    </div>

    <!-- VISTA RESULTADOS Y CUENTAS -->
    <div id="vistaResultados" style="display: none;">
      <button onclick="mostrarInicio()" class="btn-outline" style="margin-bottom: 20px; cursor: pointer;">
        <i class="fa-solid fa-arrow-left"></i> Volver al Inicio
      </button>
      <h2 id="tituloResultados" style="margin-bottom: 20px;"></h2>
      <div id="listaCuentas">
        <!-- Lista dinámica de cuentas -->
      </div>
    </div>

  </main>

  <!-- MODAL DE DETALLE Y DINÁMICA CONTABLE -->
  <div id="modalCuenta" class="modal" onclick="cerrarModalAfuera(event)">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarModal()">&times;</span>
      <span id="modalElemento" class="badge-yellow" style="margin-bottom: 10px; display: inline-block;"></span>
      <h2 id="modalCodigoNombre" style="margin: 5px 0 15px 0; font-size: 20px;"></h2>
      
      <div class="dinamica-box">
        <div class="dinamica-col debe">
          <h4 style="margin-top: 0; display: flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-plus-circle"></i> SE DEBITA (DEBE)
          </h4>
          <p id="modalDebe" style="margin: 0; line-height: 1.5;"></p>
        </div>
        <div class="dinamica-col haber">
          <h4 style="margin-top: 0; display: flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-minus-circle"></i> SE ACREDITA (HABER)
          </h4>
          <p id="modalHaber" style="margin: 0; line-height: 1.5;"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
